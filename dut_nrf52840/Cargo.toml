[package]
edition = "2024"
name = "dut_nrf52840"
version = "0.1.0"
authors = ["Axel van Abkoude <axel@vanabkou.de>"]
resolver = "2"

# Specified binaries
[[bin]]
name = "pin_influence"
path = "src/pin_influence.rs"
test = false

[[bin]]
name = "blink_single"
path = "src/blink_single.rs"
test = false

[[bin]]
name = "blink_all"
path = "src/blink_all.rs"
test = false

[[bin]]
name = "wait"
path = "src/wait.rs"
test = false

# [[bin]]
# name = "concurrency"
# path = "src/concurrency.rs"
# test = false

[[bin]]
name = "radio"
path = "src/radio.rs"
test = false


[dependencies]
# defmt = "1.0"
# defmt-rtt = "1.1"
# panic-probe = { version = "1.0", features = ["print-defmt"] }
#
# embedded-hal = "1.0.0"
# embedded-hal-async = "1.0.0"
# embedded-io = "0.7"
# embedded-io-async = "0.7"
# embedded-storage = "0.3.1"
# cortex-m-rt = "0.7.3"
#
# embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
# embassy-sync = { version = "0.7" }
# embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
#
# cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
# embassy-nrf = { version = "0.9", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }

embassy-futures = { version = "0.1.2",  }
embassy-sync = { version = "0.7.2",  features = ["defmt"] }
embassy-executor = { version = "0.9.0",  features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.0",  features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.9.0",  features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time", "net-driver"] }
embassy-net = { version = "0.8.0",  features = ["defmt", "tcp", "dhcpv4", "medium-ethernet","udp", "medium-ieee802154", "proto-ipv6"] }
embassy-usb = { version = "0.5.1",  features = ["defmt"] }
embedded-io = { version = "0.7.1", features = ["defmt"]  }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }
embassy-net-esp-hosted = { version = "0.2.1",  features = ["defmt"] }
embassy-net-enc28j60 = { version = "0.2.1",  features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"

fixed = "1.10.0"
static_cell = { version = "2" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
rand = { version = "0.9.0", default-features = false }
embedded-storage = "0.3.1"
usbd-hid = "0.9.0"
serde = { version = "1.0.136", default-features = false }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.1", features = ["async"] }
num-integer = { version = "0.1.45", default-features = false }
microfft = "0.5.0"
portable-atomic = "1"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/nrf52840" }
]
