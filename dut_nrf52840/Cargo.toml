[package]
edition = "2024"
name = "dut_nrf52840"
version = "0.1.0"
authors = ["Axel van Abkoude <axel@vanabkou.de>"]
resolver = "2"

# Specified binaries
[[bin]]
name = "pin_influence"
path = "src/pin_influence.rs"
test = false

[[bin]]
name = "blink_single"
path = "src/blink_single.rs"
test = false

[[bin]]
name = "blink_all"
path = "src/blink_all.rs"
test = false

[[bin]]
name = "wait"
path = "src/wait.rs"
test = false

# [[bin]]
# name = "concurrency"
# path = "src/concurrency.rs"
# test = false

[dependencies]
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.7" }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
embassy-nrf = { version = "0.9", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac", "time"] }


[profile.release]
debug = 2
lto = true
opt-level = 'z'

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/nrf52840" }
]
