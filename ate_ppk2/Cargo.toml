[package]
name = "ate_ppk2"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
csv = "1.4.0"
libc = "0.2.186"
ppk2 = "0.1.3"
serde = {
    version = "1",
    features = ["derive"]
}
uom = {
    version = "0.38",
    default-features = false,
    features = ["serde", "si", "f64"]
}
plotters = {
    version = "0.3.7",
    features = ["colormaps"]
}
plotters-canvas = "0.3.1"
serialport = "4.9.0"
audio_thread_priority = "0.35.1"
polars = {
    version = "0.54.4",
    default-features = false,
    features = ["parquet", "lazy", "fmt"]
}

